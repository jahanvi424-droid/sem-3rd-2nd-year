
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bank Account</title>
</head>

<body>

<script>

class BankAccount {

    constructor(accountNo, holderName, balance) {
        this.accountNo = accountNo;
        this.holderName = holderName;
        this.balance = balance;
    }

    deposit(amount) {
        this.balance += amount;
        console.log( amount);
    }

    withdraw(amount) {
        if (amount > this.balance) {
            console.log("Insufficient Balance");
        }
        else {
            this.balance -= amount;
            console.log("Amount withdrawn:", amount);
        }
    }

    displayBalance() {
        console.log(this.accountNo);
        console.log(this.holderName);
        console.log(this.balance);
    }

    static bankInfo() {
        console.log("Bank Name: ABC Bank");
        console.log("Safe and Secure Banking Services");
    }
}

let a1 = new BankAccount(101, "Jahanvi", 5000);
let a2 = new BankAccount(102, "Ruku", 3000);



BankAccount.bankInfo();


console.log("Account 1");

a1.deposit(2000);
a1.withdraw(1000);
a1.displayBalance();

</script>

</body>
</html>
