<!DOCTYPE html>
<html lang="en">

</head>
<body>
    <script>
    function sum(...values) {
        let sum = 0;

        for (let n of values) {
            sum += n;
        }

        console.log("sum", sum);
    }

    let ar = [1, 2, 3, 4, 5];

    sum(...ar);
</script>
</body>
